<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1c2433" />
<title>Workspace OS — Mobile</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app"></div>

  <!-- Правая скрываемая панель (§13) -->
  <button id="panelToggle" class="panel-toggle" aria-label="Открыть панель" aria-expanded="false">›</button>
  <aside id="sidePanel" class="side-panel" aria-hidden="true">
    <div class="side-panel__header">
      <span>Панель</span>
      <button id="panelClose" class="icon-btn" aria-label="Закрыть панель">←</button>
    </div>
    <nav class="side-panel__nav">
      <a href="#/" data-nav>🏠 Dashboard</a>
      <a href="#/files" data-nav>📁 Files</a>
      <a href="#/settings" data-nav>⚙️ Settings</a>
    </nav>
    <div id="panelContext" class="side-panel__context"></div>
  </aside>
  <div id="panelBackdrop" class="backdrop" hidden></div>

  <!-- Кнопка Quick Whim (§6) — доступна на любом основном экране -->
  <button id="quickWhim" class="fab" aria-label="Создать Whim">+ WHIM</button>

  <!-- Модал создания Whim -->
  <div id="whimModal" class="modal" hidden>
    <div class="modal__sheet" role="dialog" aria-modal="true" aria-label="Новый Whim">
      <div class="modal__title">Записать мысль</div>
      <p class="hint">Контекст (workspace / проект) определим позже. Сначала — мысль.</p>
      <textarea id="whimText" rows="4" placeholder="Что вы придумали?"></textarea>
      <div class="row">
        <button id="voiceBtn" class="btn btn--ghost">🎙 Записать голосом</button>
        <span id="voiceState" class="voice-state" hidden></span>
      </div>
      <audio id="voicePlayback" controls hidden></audio>
      <div class="row row--end">
        <button id="whimCancel" class="btn btn--ghost">Отмена</button>
        <button id="whimSave" class="btn btn--primary">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- История Whims (§5) — overlay поверх текущего экрана -->
  <div id="whimHistory" class="overlay" hidden>
    <div class="overlay__sheet">
      <div class="overlay__header">
        <button id="historyBack" class="icon-btn" aria-label="Назад">←</button>
        <strong>WHIMS</strong>
      </div>
      <input id="historySearch" type="search" placeholder="Поиск по мыслям…" />
      <div id="historyList" class="overlay__list"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

<script src="js/sync.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
