<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Танк</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #87CEEB 0%, #87CEEB 60%, #228B22 60%, #228B22 100%);
            font-family: Arial, sans-serif;
        ***REMOVED***
        .container {
            text-align: center;
        ***REMOVED***
        h1 {
            color: #1a1a1a;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.5);
            margin-bottom: 20px;
        ***REMOVED***
        svg {
            filter: drop-shadow(5px 5px 10px rgba(0,0,0,0.3));
        ***REMOVED***
    </style>
</head>
<body>
    <div class="container">
        <h1>🎖️ Т-34</h1>
        <svg width="600" height="400" viewBox="0 0 600 400">
            <!-- Тень танка -->
            <ellipse cx="300" cy="340" rx="220" ry="25" fill="rgba(0,0,0,0.2)"/>
            
            <!-- Гусеницы (левая и правая) -->
            <rect x="80" y="280" width="440" height="50" rx="25" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
            
            <!-- Колёса гусениц -->
            <circle cx="120" cy="305" r="18" fill="#444" stroke="#222" stroke-width="3"/>
            <circle cx="120" cy="305" r="8" fill="#666"/>
            <circle cx="180" cy="305" r="18" fill="#444" stroke="#222" stroke-width="3"/>
            <circle cx="180" cy="305" r="8" fill="#666"/>
            <circle cx="240" cy="305" r="18" fill="#444" stroke="#222" stroke-width="3"/>
            <circle cx="240" cy="305" r="8" fill="#666"/>
            <circle cx="300" cy="305" r="18" fill="#444" stroke="#222" stroke-width="3"/>
            <circle cx="300" cy="305" r="8" fill="#666"/>
            <circle cx="360" cy="305" r="18" fill="#444" stroke="#222" stroke-width="3"/>
            <circle cx="360" cy="305" r="8" fill="#666"/>
            <circle cx="420" cy="305" r="18" fill="#444" stroke="#222" stroke-width="3"/>
            <circle cx="420" cy="305" r="8" fill="#666"/>
            <circle cx="480" cy="305" r="18" fill="#444" stroke="#222" stroke-width="3"/>
            <circle cx="480" cy="305" r="8" fill="#666"/>
            
            <!-- Корпус танка -->
            <rect x="100" y="200" width="400" height="80" rx="5" fill="#4a5d23" stroke="#2d3a14" stroke-width="3"/>
            
            <!-- Детали корпуса (бронеплиты) -->
            <rect x="110" y="210" width="120" height="60" rx="3" fill="#556b2f" stroke="#3d4f1f" stroke-width="1"/>
            <rect x="240" y="210" width="120" height="60" rx="3" fill="#556b2f" stroke="#3d4f1f" stroke-width="1"/>
            <rect x="370" y="210" width="120" height="60" rx="3" fill="#556b2f" stroke="#3d4f1f" stroke-width="1"/>
            
            <!-- Башня -->
            <ellipse cx="280" cy="200" rx="120" ry="45" fill="#4a5d23" stroke="#2d3a14" stroke-width="3"/>
            <ellipse cx="280" cy="195" rx="110" ry="38" fill="#556b2f" stroke="#3d4f1f" stroke-width="2"/>
            
            <!-- Люк башни -->
            <ellipse cx="280" cy="185" rx="30" ry="15" fill="#3d4f1f" stroke="#2d3a14" stroke-width="2"/>
            <circle cx="280" cy="185" r="5" fill="#666"/>
            
            <!-- Пулемёт на крыше -->
            <rect x="310" y="160" width="40" height="8" rx="2" fill="#333" stroke="#1a1a1a" stroke-width="1"/>
            <circle cx="355" cy="164" r="4" fill="#222"/>
            
            <!-- Орудие (ствол) -->
            <rect x="380" y="185" width="180" height="16" rx="3" fill="#3d4f1f" stroke="#2d3a14" stroke-width="2"/>
            <rect x="540" y="180" width="30" height="26" rx="3" fill="#4a5d23" stroke="#2d3a14" stroke-width="2"/>
            <circle cx="570" cy="193" r="8" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
            
            <!-- Дымоход -->
            <rect x="150" y="170" width="20" height="40" rx="2" fill="#555" stroke="#333" stroke-width="2"/>
            
            <!-- Дым из дымохода -->
            <circle cx="160" cy="155" r="8" fill="rgba(128,128,128,0.6)"/>
            <circle cx="155" cy="140" r="10" fill="rgba(128,128,128,0.5)"/>
            <circle cx="165" cy="125" r="12" fill="rgba(128,128,128,0.4)"/>
            <circle cx="158" cy="108" r="14" fill="rgba(128,128,128,0.3)"/>
            
            <!-- Звезда на башне -->
            <polygon points="280,175 283,182 291,182 285,187 287,195 280,190 273,195 275,187 269,182 277,182" 
                     fill="#c41e3a" stroke="#8b0000" stroke-width="1"/>
            
            <!-- Номер танка -->
            <text x="200" y="245" font-family="Arial, sans-serif" font-size="24" font-weight="bold" 
                  fill="#c41e3a" stroke="#8b0000" stroke-width="0.5">34</text>
        </svg>
        <p style="color: #1a1a1a; font-size: 14px; margin-top: 10px;">Легендарный советский средний танк Великой Отечественной войны</p>
    </div>
</body>
</html>
