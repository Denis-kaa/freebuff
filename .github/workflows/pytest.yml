name: CI

on:
  push:
    branches: [master, main***REMOVED***
  pull_request:
    branches: [master, main***REMOVED***

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"***REMOVED***

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version ***REMOVED******REMOVED***
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version ***REMOVED******REMOVED***
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only torch first to avoid massive CUDA wheels
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Prepare environment
        run: |
          mkdir -p context data sessions
          git config --global user.email "ci@buffy.local"
          git config --global user.name "Buffy CI"

      - name: Run pytest
        env:
          PYTHONPATH: ${{ github.workspace ***REMOVED******REMOVED***
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Run consistency check (Stage 9 — registries as data)
        env:
          PYTHONPATH: ${{ github.workspace ***REMOVED******REMOVED***
        run: |
          python scripts/consistency_check.py --report

      - name: Run drift check (Stage 9 — docs vs. reality, hard fail)
        env:
          PYTHONPATH: ${{ github.workspace ***REMOVED******REMOVED***
        run: |
          python scripts/drift_check.py --force --report
