# Шаблон runtime-прайса доп. работ широкоформата (для владельца).
#
# Как пользоваться:
#   1) скопируйте файл в data/wide_prices.yaml (рядом с корнем printcalc) или
#      задайте свой путь в переменной окружения PRINTCALC_WEB_PRICES;
#   2) раскомментируйте нужные работы и поправьте цены (sell — продажа,
#      cost — закупка/себестоимость; допустимы оба или один);
#   3) сервис перечитывает файл автоматически (по mtime) — рестарт не нужен.
#
# Правила (printcalc_web/pricing.py, ошибки громкие — PriceConfigError):
#   - переопределение ТОЛЬКО по каноническому имени работы (полный список ниже);
#   - ключи записи: sell и/или cost — числа ≥ 0;
#   - неизвестное имя работы или лишний ключ → расчёты упадут с понятной
#     ошибкой в логе; исправьте файл — сервис восстановится сам.
#
# Единицы работ (формулы зафиксированы в каноне, ревью OP-22 2026-09-12):
#   м²    — тиражная площадь (ширина×высота×тираж): цена растёт с размером И тиражом;
#   пог.м — общий периметр всех экземпляров;
#   шт    — тираж (люверсы — из интервала, см).
#
# Якорь для «Плоттерной резки» (решение 2026-09-12, РОАДМАП_v7 §10):
# legacy-прайс «Резка по контуру» — м², cost 100 / sell 500
# (wide_format_config.json, GUI-редактор Общего калькулятора печати).
# Выборка плёнки и накатка (монтажка) — отдельные работы, в цену резки не входят.

works:
