<!DOCTYPE html>

<div class="app">
  <aside class="sidebar">

      <span class="brand-name">Печатникъ</span>
    </a>

    <nav class="nav">
      <div class="nav-label">Работа</div>
      <a class="nav-item {{ 'active' if active == 'home' }}" href="/">
        <svg class="ic"><use href="#i-dashboard"/></svg><span>Приём заказа</span>
      </a>
      <a class="nav-item {{ 'active' if active == 'orders' }}" href="/orders">
        <svg class="ic"><use href="#i-cart"/></svg><span>Заказы</span>
      </a>
      <a class="nav-item {{ 'active' if active == 'production' }}" href="/production">
        <svg class="ic"><use href="#i-sliders"/></svg><span>Производство</span>
      </a>
      <a class="nav-item {{ 'active' if active == 'inbox' }}" href="/inbox">
        <svg class="ic"><use href="#i-card"/></svg><span>Входящие</span>
      </a>
      <a class="nav-item {{ 'active' if active == 'estimates' }}" href="/estimates">
        <svg class="ic"><use href="#i-tags"/></svg><span>Сметы</span>
      </a>
      <a class="nav-item {{ 'active' if active == 'price' }}" href="/price-list">
        <svg class="ic"><use href="#i-tags"/></svg><span>Прайс-каталог</span>
      </a>
      <a class="nav-item {{ 'active' if active == 'constructor' }}" href="/constructor">
        <svg class="ic"><use href="#i-sliders"/></svg><span>Конструктор экрана</span>
      </a>

      <div class="nav-label">Дальше по плану</div>

        <svg class="ic"><use href="#i-users"/></svg><span>Клиенты</span>
      </a>
      <a class="nav-item {{ 'active' if active == 'materials' }}" href="/materials">
        <svg class="ic"><use href="#i-package"/></svg><span>Материалы</span>
      </a>
      <a class="nav-item disabled" title="Раздел появится в одном из следующих этапов">
        <svg class="ic"><use href="#i-card"/></svg><span>Оплаты</span><span class="soon">скоро</span>
      </a>
      <a class="nav-item disabled" title="Раздел появится в одном из следующих этапов">
        <svg class="ic"><use href="#i-sparkle"/></svg><span>AI-помощник</span><span class="soon">скоро</span>
      </a>

        <div class="avatar">ДС</div>
        <div>
          <div class="user-name">Денис</div>

      <h1>{{ page_title|default("Печатникъ") }}</h1>
