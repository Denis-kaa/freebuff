{% set active = 'orders' %}
{% set page_title = 'Заказы' %}
{% set page_script %}<script src="/static/orders.js"></script>{% endset %}
{% include "_shell_top.html" %}

  <div class="panel">
    <div class="panel-head">
      <h2>Все заказы</h2>
      <div class="seg" id="status-filter" role="tablist" aria-label="Фильтр по статусу">
        <button data-status="" class="primary">все</button>
        <button data-status="новый">новый</button>
        <button data-status="в работе">в работе</button>
        <button data-status="выполнен">выполнен</button>
        <button data-status="завершён">завершён</button>
      </div>
    </div>
    <div class="table-wrap">
      <table id="orders-table">
        <thead>
          <tr><th>№</th><th>Создан</th><th>Клиент</th><th>Позиции</th><th class="num">Сумма</th><th>Оплата</th><th>Статус</th><th></th></tr>
        </thead>
        <tbody id="orders-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Диалог заказа: статус + OrderExport (Р1) -->
  <dialog id="dlg-order">
    <h2>Заказ <small>№ <span id="dlg-order-id"></span></small></h2>
    <div class="table-wrap">
      <table id="dlg-order-items"></table>
    </div>
    <div id="dlg-order-wishes" class="hidden" style="margin-top:12px">
      <div class="muted" style="margin-bottom:6px">Пожелания заказчика</div>
      <div id="dlg-order-wishes-text" class="wishes-quote"></div>
    </div>
    <div id="dlg-order-sections" style="margin-top:10px"></div>
    <div class="row" style="margin-top:14px">
      <label>Статус:
        <select id="dlg-order-status">
          <option>новый</option>
          <option>в работе</option>
          <option>выполнен</option>
          <option>завершён</option>
        </select>
      </label>
      <button id="btn-order-status-save" class="primary">Сохранить статус</button>
      <button id="btn-order-produce">В производство</button>
      <button id="btn-order-reserve">Резерв на складе</button>
      <button id="btn-order-consume">Списать материалы</button>
      <div class="spacer"></div>
      <a id="btn-order-export" class="btn" target="_blank" rel="noopener">Экспорт для WF</a>
      <button id="btn-order-copy">Копировать текст</button>
    </div>
    <div id="dlg-order-msg" class="notice"></div>
    <div class="dlg-actions">
      <button data-close>Закрыть</button>
    </div>
  </dialog>

{% include "_shell_bottom.html" %}
