# Пак правил продукта «наклейка» (речевой продукт; калькулятор wide).
#
# S0 РОАДМАП_v7 · источник правил: промт_печатник_6 §4.1/§4.2 (интервью
# 2026-09-12) + UPSELL_RULES.md + QUESTION_FLOW.md + TERMS_GLOSSARY.md
# («Плоттерная резка» = M1 прайс, EXISTING). Жаргон в правилах не
# выдумывается: каждая подсказка несёт reason с источником.
#
# Правила могут только ПРЕДЛАГАТЬ: ничего не попадает в заказ без
# подтверждения сотрудника (промт_6 §1 «распознать» ≠ «предложить»).
schema_version: 1
pack: sticker
product: wide                # калькулятор широкоформатной печати (реестр движка)
product_label: "наклейка"    # речевой продукт; нормализатор S1 выводит label из текста

rules:
  # Промт_6 §4.1: «Наклейка 50×30, 149 шт + резка по контуру» →
  # стикер + контурная резка = плоттерная резка (OP-22, см. отчёт R0 §3).
  - rule_id: STICKER_CUT_CONTOUR_PLOTTER
    when_facts:
      cutting: "true"
      cutting_mode: "contour"
    propose_operation: OP-22          # «Плоттерная резка» — новый код каталога (не OP-15!)
    require:
      - quantity
      - layout_with_cut_contour
    suggest:
      - kind: layout
        label: "Макет: есть готовый макет с контуром резки?"
        options: ["Да, макет готов", "Нужно подготовить макет", "Макета нет"]
        reason: "sticker + cut_contour → для плоттерной резки нужен контур в макете (промт_6 §4.1; PRODUCTION_CHECKLISTS: контур отдельным слоем)"
      - kind: material
        label: "Материал: самоклеящаяся плёнка (по умолчанию из реестра)"
        options: ["Ок", "Другой материал"]
        reason: "наклейка → плёнка самоклеящаяся по умолчанию (wide PRICE_MATERIALS; MATERIAL_MODEL)"

  # Промт_6 §4.2: «порезать поштучно» → плоттерная резка поштучно.
  # Сотрудник не знает терминологии — система переводит его слова.
  - rule_id: STICKER_CUT_INDIVIDUAL_PLOTTER
    when_facts:
      cutting: "true"
      cutting_mode: "individual"
    propose_operation: OP-22
    require:
      - quantity
    suggest:
      - kind: layout
        label: "Порезка поштучно: макет уже с контурами по размерам?"
        options: ["Да, контуры есть", "Нужно подготовить", "Уточнить позже"]
        reason: "поштучная порезка требует контуров по размеру каждой наклейки (промт_6 §4.2)"

  # «С монтажной» (монтажная плёнка) — факт из текста: подтверждаем
  # как операцию нанесения (накатка на основу, каталог §2 OP-15).
  - rule_id: STICKER_MOUNTING_FILM_APPPRESS
    when_facts:
      mounting_film: "true"
    propose_operation: OP-15          # «Накатка на основу» — монтажная плёнка накатывается на изделие
    require:
      - quantity
    suggest:
      - kind: question
        label: "Монтажная плёнка: накатать на изделие целиком или передать отдельно?"
        options: ["Накатать", "Передать отдельно"]
        reason: "«с монтажной» = аппликация с монтажной плёнкой (промт_6 §4.2; TERMS_GLOSSARY)"

  # Контекст: наклейка на улицу (R-03) — экстерьерная стойкость.
  # Подсказка только для usage=улица: контекстность, не анкета (§4.5).
  - rule_id: STICKER_OUTDOOR_EXTERIOR
    when_facts:
      usage: "улица"
    propose_operation: null
    require:
      - quantity
    suggest:
      - kind: upsell
        label: "Улица: предложить плёнку с УФ-стойкостью / экстерьерную печать"
        options: ["Предложить клиенту", "Не нужно"]
        reason: "использование = улица → экстерьерная печать (UPSELL_RULES R-03)"

  # S1 (решение Дениса 2026-09-12, PHASE_RULES_R0_REPORT §6.2):
  # «оформление витрины (плёнка)» — плёночный продукт. Витрина — ФАКТ
  # текста (факт vitrine нормализатора S1), печать по площади — ФАКТ:
  # предложением операции подтверждаем, не добавляем (промт_6 §1).
  # Печатная диза йн-услуга каталога: universal_calc/design «Оформление
  # витрины (плёнка)» 2000/2600/5000. Требует площадь — как wide-работа.
  - rule_id: STICKER_WINDOW_VITRINE
    when_facts:
      vitrine: "true"
    propose_operation: OP-04          # «Напечатать (широкоформат)» — витрина печатается на wide
    require:
      - size_mm
    suggest:
      - kind: layout
        label: "Витрина: есть готовый макет с размерами витражей?"
        options: ["Да", "Нужен дизайн", "Уточнить позже"]
        reason: "оформление витрины плёнкой → макет по размерам остекления (design_calc «Оформление витрины (плёнка)»; UPSELL_RULES R-05)"
