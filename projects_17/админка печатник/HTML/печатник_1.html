<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Печатникъ — Система управления</title>
    
    <!-- Подключаем Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Настройка цветов бренда -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#18181b',
                            raised: '#212124',
                            card: '#26262a',
                            wood: '#c9a876',
                            woodHover: '#d4b483',
                            neon: '#ffb84d',
                            text: '#f0f0ee',
                            dim: '#a3a3a8',
                            faint: '#6b6b70',
                            line: '#38383d'
                        }
                    },
                    fontFamily: {
                        display: ['Georgia', 'serif'], // Имитация Fraunces
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <!-- Подключаем React и ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel для компиляции JSX прямо в браузере -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons (глобальная версия) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { background-color: #18181b; color: #f0f0ee; }
        /* Кастомный скроллбар */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #212124; }
        ::-webkit-scrollbar-thumb { background: #38383d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #c9a876; }
        
        .animate-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- КОМПОНЕНТ ИКОНОК (Адаптер для Lucide Global) ---
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });
            return <i data-lucide={name} width={size} height={size} className={className}></i>;
        };

        // --- MOCK DATA & CONSTANTS ---
        const STATUS_FLOW = [
            { id: 'new', label: 'Новый', color: 'bg-blue-500' },
            { id: 'accepted', label: 'Принят', color: 'bg-indigo-500' },
            { id: 'payment_pending', label: 'Ожидает оплаты', color: 'bg-orange-500' },
            { id: 'preparation', label: 'Подготовка', color: 'bg-yellow-500' },
            { id: 'production', label: 'Производство', color: 'bg-purple-500' },
            { id: 'qc', label: 'Контроль качества', color: 'bg-pink-500' },
            { id: 'ready', label: 'Готов', color: 'bg-green-500' },
            { id: 'closed', label: 'Закрыт', color: 'bg-gray-500' },
        ];

        const INITIAL_CLIENTS = [
            { id: 1, name: "Иванова Е. С.", type: "Физ. лицо", phone: "+7 (900) 123-45-67", email: "ivanova@mail.ru", lastOrder: "10.09.2023", totalSpent: 15400, debt: 0, status: "active" },
            { id: 2, name: "ООО «СеверСтрой»", type: "Юр. лицо", phone: "+7 (3462) 22-14-56", email: "info@severstroy.ru", lastOrder: "08.09.2023", totalSpent: 124500, debt: 5000, status: "vip" },
            { id: 3, name: "Смирнов А. П.", type: "Физ. лицо", phone: "+7 (900) 555-22-33", email: "smirnov@gmail.com", lastOrder: "01.09.2023", totalSpent: 3200, debt: 0, status: "active" },
            { id: 4, name: "ИП Дроздов В. С.", type: "ИП", phone: "+7 (922) 600-44-11", email: "drozdov@bk.ru", lastOrder: "12.09.2023", totalSpent: 45000, debt: 0, status: "active" },
        ];

        const INITIAL_ORDERS = [
            { 
                id: 1048, clientId: 1, clientName: "Иванова Е. С.", date: "08.09.2023", sum: 4200, paid: 2000, 
                status: "production", items: [{name: "Баннер 2x1м", qty: 1, price: 3800}, {name: "Люверсы", qty: 1, price: 400}],
                history: ["Создан заказ", "Частичная оплата"]
            },
            { 
                id: 1047, clientId: 2, clientName: "ООО «СеверСтрой»", date: "08.09.2023", sum: 1800, paid: 1800, 
                status: "ready", items: [{name: "Визитки 200шт", qty: 1, price: 1800}],
                history: ["Создан заказ", "Оплачен полностью", "Передан в производство", "Готов к выдаче"]
            },
            { 
                id: 1046, clientId: 3, clientName: "Смирнов А. П.", date: "07.09.2023", sum: 450, paid: 450, 
                status: "closed", items: [{name: "Фото на паспорт", qty: 1, price: 200}, {name: "Ламинация А4", qty: 5, price: 50}],
                history: ["Создан заказ", "Оплачен", "Выполнен", "Выдан"]
            },
        ];

        const MATERIALS = [
            { id: 1, name: "Баннерная ткань 440г/м²", unit: "м²", stock: 12.5, reserved: 8.0, min: 10 },
            { id: 2, name: "Бумага для визиток 300г", unit: "пачка", stock: 5, reserved: 0, min: 2 },
            { id: 3, name: "Чернила сольвентные (Cyan)", unit: "л", stock: 0.5, reserved: 0.2, min: 1 },
            { id: 4, name: "Люверсы металлические", unit: "шт", stock: 500, reserved: 100, min: 200 },
        ];

        // --- UI COMPONENTS ---
        const Button = ({ children, variant = 'primary', size = 'md', className = '', onClick, disabled }) => {
            const base = "inline-flex items-center justify-center font-medium transition-colors rounded-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-brand-bg";
            const variants = {
                primary: "bg-brand-wood text-brand-bg hover:bg-brand-woodHover focus:ring-brand-wood",
                secondary: "bg-brand-card text-brand-text border border-brand-line hover:bg-brand-line focus:ring-brand-line",
                ghost: "text-brand-dim hover:text-brand-text hover:bg-brand-card",
                danger: "bg-red-900/20 text-red-400 border border-red-900/50 hover:bg-red-900/40",
                neon: "bg-transparent text-brand-neon border border-brand-neon shadow-[0_0_10px_rgba(255,184,77,0.2)] hover:bg-brand-neon/10"
            };
            const sizes = { sm: "h-8 px-3 text-xs", md: "h-10 px-4 text-sm", lg: "h-12 px-6 text-base" };
            
            return (
                <button 
                    onClick={onClick} 
                    disabled={disabled}
                    className={`${base} ${variants[variant]} ${sizes[size]} ${className} ${disabled ? 'opacity-50 cursor-not-allowed' : ''}`}
                >
                    {children}
                </button>
            );
        };

        const Badge = ({ status }) => {
            const config = STATUS_FLOW.find(s => s.id === status) || { label: status, color: 'bg-gray-500' };
            // Преобразуем bg-color в text-color и bg-opacity для темной темы
            const colorClass = config.color.replace('bg-', 'text-').replace('500', '400');
            const bgClass = config.color.replace('bg-', 'bg-').replace('500', '500/10');
            const borderClass = config.color.replace('bg-', 'border-').replace('500', '500/20');

            return (
                <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border ${bgClass} ${colorClass} ${borderClass}`}>
                    {config.label}
                </span>
            );
        };

        const Input = ({ label, ...props }) => (
            <div className="mb-4">
                {label && <label className="block text-xs text-brand-dim mb-1.5 uppercase tracking-wider">{label}</label>}
                <input 
                    className="w-full bg-brand-raised border border-brand-line rounded-md px-3 py-2 text-brand-text placeholder-brand-faint focus:outline-none focus:border-brand-wood focus:ring-1 focus:ring-brand-wood transition-all"
                    {...props}
                />
            </div>
        );

        const Card = ({ children, className = '', title, action }) => (
            <div className={`bg-brand-card border border-brand-line rounded-lg overflow-hidden ${className}`}>
                {(title || action) && (
                    <div className="px-5 py-4 border-b border-brand-line flex justify-between items-center bg-brand-raised">
                        {title && <h3 className="font-display text-lg font-semibold text-brand-text">{title}</h3>}
                        {action && <div>{action}</div>}
                    </div>
                )}
                <div className="p-5">{children}</div>
            </div>
        );

        // --- MAIN APP LOGIC ---
        const App = () => {
            const [currentView, setCurrentView] = useState('dashboard');
            const [selectedId, setSelectedId] = useState(null);
            const [clients, setClients] = useState(INITIAL_CLIENTS);
            const [orders, setOrders] = useState(INITIAL_ORDERS);
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);

            const navigateTo = (view, id = null) => {
                setCurrentView(view);
                if (id) setSelectedId(id);
            };

            const handleCreateOrderFromEstimate = (estimateData) => {
                const newOrder = {
                    id: Math.floor(Math.random() * 1000) + 1050,
                    clientId: estimateData.clientId,
                    clientName: clients.find(c => c.id === estimateData.clientId)?.name || "Unknown",
                    date: new Date().toLocaleDateString('ru-RU'),
                    sum: estimateData.total,
                    paid: 0,
                    status: 'new',
                    items: estimateData.items,
                    history: ["Создан из сметы"]
                };
                setOrders([newOrder, ...orders]);
                navigateTo('orders', newOrder.id);
            };

            const updateOrderStatus = (orderId, newStatus) => {
                setOrders(orders.map(o => o.id === orderId ? { ...o, status: newStatus, history: [...o.history, `Статус изменен на: ${STATUS_FLOW.find(s=>s.id===newStatus).label}`] } : o));
            };

            // Рендер контента
            const renderContent = () => {
                switch (currentView) {
                    case 'dashboard': return <DashboardView orders={orders} materials={MATERIALS} onNavigate={navigateTo} />;
                    case 'clients': return <ClientsView clients={clients} onSelect={(id) => navigateTo('client_detail', id)} />;
                    case 'client_detail': return <ClientDetailView client={clients.find(c => c.id === selectedId)} orders={orders.filter(o => o.clientId === selectedId)} onRepeatOrder={(clientId) => navigateTo('inquiry', clientId)} />;
                    case 'inquiry': return <InquiryView clients={clients} onStartEstimate={(data) => navigateTo('calculator', data)} />;
                    case 'calculator': return <CalculatorView initialData={selectedId ? { clientId: selectedId } : {}} onComplete={(data) => navigateTo('estimate', data)} />;
                    case 'estimate': return <EstimateView data={selectedId} onSave={() => {}} onCreateOrder={handleCreateOrderFromEstimate} />;
                    case 'orders': return <OrdersView orders={orders} onSelect={(id) => navigateTo('order_detail', id)} />;
                    case 'order_detail': return <OrderDetailView order={orders.find(o => o.id === selectedId)} onUpdateStatus={updateOrderStatus} />;
                    case 'warehouse': return <WarehouseView materials={MATERIALS} />;
                    default: return <div className="p-10 text-center text-brand-faint">Раздел в разработке</div>;
                }
            };

            return (
                <div className="flex h-screen bg-brand-bg text-brand-text font-sans selection:bg-brand-wood selection:text-brand-bg">
                    {/* Sidebar */}
                    <aside className={`${isSidebarOpen ? 'w-64' : 'w-20'} flex-shrink-0 bg-brand-raised border-r border-brand-line transition-all duration-300 flex flex-col z-20`}>
                        <div className="h-16 flex items-center px-6 border-b border-brand-line">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 rounded-full border-2 border-brand-wood flex items-center justify-center text-brand-wood">
                                    <Icon name="printer" size={16} />
                                </div>
                                {isSidebarOpen && <span className="font-display text-xl font-bold tracking-wide text-brand-text">Печатникъ</span>}
                            </div>
                        </div>

                        <nav className="flex-1 py-6 px-3 space-y-1 overflow-y-auto custom-scrollbar">
                            <NavItem icon="layout-dashboard" label="Главная" active={currentView === 'dashboard'} collapsed={!isSidebarOpen} onClick={() => navigateTo('dashboard')} />
                            <NavItem icon="users" label="Клиенты" active={currentView.includes('client')} collapsed={!isSidebarOpen} onClick={() => navigateTo('clients')} />
                            <NavItem icon="file-text" label="Обращения" active={currentView === 'inquiry'} collapsed={!isSidebarOpen} onClick={() => navigateTo('inquiry')} />
                            <NavItem icon="calculator" label="Калькулятор" active={currentView === 'calculator'} collapsed={!isSidebarOpen} onClick={() => navigateTo('calculator')} />
                            <NavItem icon="shopping-cart" label="Сметы" active={currentView === 'estimate'} collapsed={!isSidebarOpen} onClick={() => {}} />
                            <NavItem icon="package" label="Заказы" active={currentView.includes('order')} collapsed={!isSidebarOpen} onClick={() => navigateTo('orders')} />
                            <NavItem icon="factory" label="Производство" active={false} collapsed={!isSidebarOpen} onClick={() => {}} />
                            <NavItem icon="credit-card" label="Оплаты" active={false} collapsed={!isSidebarOpen} onClick={() => {}} />
                            <NavItem icon="folder-open" label="Склад" active={currentView === 'warehouse'} collapsed={!isSidebarOpen} onClick={() => navigateTo('warehouse')} />
                            <NavItem icon="bot" label="AI Помощник" active={false} collapsed={!isSidebarOpen} highlight onClick={() => {}} />
                        </nav>

                        <div className="p-4 border-t border-brand-line">
                           <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="w-full flex items-center justify-center p-2 rounded-md hover:bg-brand-card text-brand-faint">
                             {isSidebarOpen ? <Icon name="arrow-left" size={18} /> : <Icon name="menu" size={18} />}
                           </button>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 flex flex-col min-w-0 overflow-hidden">
                        <header className="h-16 bg-brand-raised/80 backdrop-blur-md border-b border-brand-line flex items-center justify-between px-6 z-10">
                            <div className="flex items-center flex-1 max-w-xl">
                                <div className="relative w-full group">
                                    <Icon name="search" className="absolute left-3 top-1/2 -translate-y-1/2 text-brand-faint group-focus-within:text-brand-wood transition-colors" size={18} />
                                    <input 
                                        type="text" 
                                        placeholder="Поиск заказов, клиентов, материалов..." 
                                        className="w-full bg-brand-raised border border-brand-line rounded-full pl-10 pr-4 py-2 text-sm text-brand-text focus:outline-none focus:border-brand-wood focus:ring-1 focus:ring-brand-wood transition-all"
                                    />
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-4 ml-4">
                                <button className="relative p-2 text-brand-faint hover:text-brand-text transition-colors">
                                    <Icon name="bell" size={20} />
                                    <span className="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
                                </button>
                                <div className="h-8 w-px bg-brand-line"></div>
                                <div className="flex items-center gap-3 cursor-pointer hover:opacity-80 transition-opacity">
                                    <div className="text-right hidden sm:block">
                                        <div className="text-sm font-medium text-brand-text">Денис С.</div>
                                        <div className="text-xs text-brand-faint">Администратор</div>
                                    </div>
                                    <div className="w-9 h-9 rounded-full bg-brand-wood flex items-center justify-center text-brand-bg font-bold text-sm">ДС</div>
                                </div>
                            </div>
                        </header>

                        <div className="flex-1 overflow-y-auto p-6 custom-scrollbar">
                            <div className="max-w-7xl mx-auto animate-in fade-in duration-300">
                                {renderContent()}
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        // --- SUB-VIEWS ---
        const NavItem = ({ icon, label, active, collapsed, onClick, highlight }) => {
            return (
                <button 
                    onClick={onClick}
                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-md transition-all duration-200 group relative
                        ${active 
                          ? 'bg-brand-card text-brand-wood border-l-2 border-brand-wood' 
                          : 'text-brand-dim hover:bg-brand-raised hover:text-brand-text border-l-2 border-transparent'
                        }
                        ${highlight ? 'text-brand-neon hover:text-brand-neon' : ''}
                    `}
                >
                    <span className={`${active ? 'text-brand-wood' : highlight ? 'text-brand-neon' : 'text-brand-faint group-hover:text-brand-text'}`}>
                        <Icon name={icon} size={20} />
                    </span>
                    {!collapsed && <span className="text-sm font-medium whitespace-nowrap">{label}</span>}
                    {collapsed && (
                        <div className="absolute left-full ml-2 px-2 py-1 bg-brand-card text-brand-text text-xs rounded opacity-0 group-hover:opacity-100 pointer-events-none whitespace-nowrap z-50 border border-brand-line shadow-xl">
                            {label}
                        </div>
                    )}
                </button>
            );
        };

        const DashboardView = ({ orders, materials, onNavigate }) => {
            const stats = [
                { label: "В работе", value: orders.filter(o => o.status === 'production').length, sub: "заказов", color: "border-l-brand-wood" },
                { label: "Готово к выдаче", value: orders.filter(o => o.status === 'ready').length, sub: "клиентов ждут", color: "border-l-green-500" },
                { label: "Выручка сегодня", value: "12 400 ₽", sub: "+15% к вчера", color: "border-l-brand-neon" },
                { label: "Задолженность", value: "5 000 ₽", sub: "1 клиент", color: "border-l-red-500" },
            ];

            return (
                <div className="space-y-6">
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        {stats.map((stat, i) => (
                            <Card key={i} className={`border-l-4 ${stat.color} !p-6`}>
                                <div className="text-brand-faint text-xs uppercase tracking-wider font-semibold mb-2">{stat.label}</div>
                                <div className="text-3xl font-display font-bold text-brand-text mb-1">{stat.value}</div>
                                <div className="text-xs text-brand-dim">{stat.sub}</div>
                            </Card>
                        ))}
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2 space-y-6">
                            <Card title="Активные заказы" action={<Button variant="ghost" size="sm" onClick={() => onNavigate('orders')}>Все заказы</Button>}>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-sm">
                                        <thead className="text-brand-faint border-b border-brand-line">
                                            <tr>
                                                <th className="pb-3 font-medium">№ Заказа</th>
                                                <th className="pb-3 font-medium">Клиент</th>
                                                <th className="pb-3 font-medium">Сумма</th>
                                                <th className="pb-3 font-medium">Статус</th>
                                                <th className="pb-3 font-medium text-right">Действие</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-brand-line">
                                            {orders.slice(0, 5).map(order => (
                                                <tr key={order.id} className="group hover:bg-brand-card transition-colors cursor-pointer" onClick={() => onNavigate('order_detail', order.id)}>
                                                    <td className="py-3 text-brand-wood font-mono">#{order.id}</td>
                                                    <td className="py-3 text-brand-text">{order.clientName}</td>
                                                    <td className="py-3 text-brand-text">{order.sum.toLocaleString()} ₽</td>
                                                    <td className="py-3"><Badge status={order.status} /></td>
                                                    <td className="py-3 text-right">
                                                        <Icon name="chevron-right" size={16} className="inline text-brand-faint group-hover:text-brand-text" />
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </Card>
                        </div>

                        <div className="space-y-6">
                            <Card title="Склад: Внимание">
                                <div className="space-y-4">
                                    {materials.filter(m => m.stock <= m.min).map(mat => (
                                        <div key={mat.id} className="flex items-start gap-3 p-3 bg-red-900/10 border border-red-900/30 rounded-md">
                                            <Icon name="alert-triangle" className="text-red-400 shrink-0 mt-0.5" size={16} />
                                            <div>
                                                <div className="text-sm font-medium text-red-200">{mat.name}</div>
                                                <div className="text-xs text-red-300/70 mt-1">Остаток: {mat.stock} {mat.unit} (Мин: {mat.min})</div>
                                            </div>
                                        </div>
                                    ))}
                                    {materials.filter(m => m.stock <= m.min).length === 0 && (
                                        <div className="text-center py-8 text-brand-faint text-sm">Нет критических остатков</div>
                                    )}
                                </div>
                            </Card>
                            
                            <Card title="Быстрые действия" className="!p-4">
                                <div className="grid grid-cols-2 gap-3">
                                    <Button variant="secondary" size="sm" className="h-auto py-3 flex flex-col gap-2" onClick={() => onNavigate('inquiry')}>
                                        <Icon name="plus" size={20} /> Новое обращение
                                    </Button>
                                    <Button variant="secondary" size="sm" className="h-auto py-3 flex flex-col gap-2" onClick={() => onNavigate('calculator')}>
                                        <Icon name="calculator" size={20} /> Расчет
                                    </Button>
                                </div>
                            </Card>
                        </div>
                    </div>
                </div>
            );
        };

        const ClientsView = ({ clients, onSelect }) => {
            return (
                <Card title="База клиентов" action={<Button size="sm"><Icon name="plus" size={16} className="mr-2"/> Добавить клиента</Button>}>
                    <div className="flex gap-4 mb-6">
                        <Input placeholder="Поиск по имени, телефону..." className="mb-0 max-w-md" />
                    </div>
                    <div className="overflow-x-auto">
                        <table className="w-full text-left text-sm">
                            <thead className="text-brand-faint border-b border-brand-line">
                                <tr>
                                    <th className="pb-3 font-medium">Клиент</th>
                                    <th className="pb-3 font-medium">Тип</th>
                                    <th className="pb-3 font-medium">Контакты</th>
                                    <th className="pb-3 font-medium text-right">Сумма заказов</th>
                                    <th className="pb-3 font-medium text-right">Действие</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-brand-line">
                                {clients.map(client => (
                                    <tr key={client.id} className="hover:bg-brand-card transition-colors">
                                        <td className="py-4">
                                            <div className="font-medium text-brand-text">{client.name}</div>
                                            {client.status === 'vip' && <span className="text-[10px] text-brand-wood uppercase tracking-wider font-bold">VIP Клиент</span>}
                                        </td>
                                        <td className="py-4 text-brand-dim">{client.type}</td>
                                        <td className="py-4 text-brand-dim">
                                            <div>{client.phone}</div>
                                            <div className="text-xs opacity-70">{client.email}</div>
                                        </td>

                                <div className="space-y-4 text-sm">
                                    <div>
                                        <div className="text-brand-faint mb-1">Пожелания клиента</div>
                                        <div className="text-brand-text bg-brand-raised p-3 rounded border border-brand-line italic">
                                            "Тёмно-синий фон, как на прошлом макете."
                                        </div>
                                    </div>
                                    <div>
                                        <div className="text-brand-faint mb-1">Файлы</div>
                                        <div className="flex items-center gap-2 p-2 bg-brand-raised rounded border border-brand-line cursor-pointer hover:border-brand-wood transition-colors">
                                            <Icon name="file-text" size={16} className="text-brand-wood"/>
                                            <span className="text-brand-text truncate flex-1">banner_v2_final.pdf</span>
                                            <span className="text-xs text-brand-faint">2.4MB</span>
                                        </div>
                                    </div>
                                </div>
                            </Card>
                            
                            <Card title="История изменений">
                                <div className="space-y-4 relative before:absolute before:left-[11px] before:top-2 before:bottom-2 before:w-px before:bg-brand-line">
                                    {order.history.map((event, i) => (
                                        <div key={i} className="relative pl-8">
                                            <div className="absolute left-0 top-1.5 w-[22px] h-[22px] bg-brand-card border border-brand-line rounded-full flex items-center justify-center z-10">
                                                <div className="w-1.5 h-1.5 bg-brand-faint rounded-full"></div>
                                            </div>
                                            <div className="text-xs text-brand-faint mb-0.5">Сегодня, 14:3{i}</div>
                                            <div className="text-sm text-brand-text">{event}</div>
                                        </div>
                                    ))}
                                </div>
                            </Card>
                        </div>
                    </div>
                </div>
            );
        };

        const WarehouseView = ({ materials }) => {
            return (
                <Card title="Склад материалов" action={<Button size="sm">Приход материала</Button>}>
                    <div className="overflow-x-auto">
                        <table className="w-full text-left text-sm">
                            <thead className="text-brand-faint border-b border-brand-line">
                                <tr>
                                    <th className="pb-3 font-medium">Наименование</th>
                                    <th className="pb-3 font-medium">Ед. изм.</th>
                                    <th className="pb-3 font-medium text-right">Остаток</th>
                                    <th className="pb-3 font-medium text-right">Резерв</th>
                                    <th className="pb-3 font-medium text-right">Доступно</th>
                                    <th className="pb-3 font-medium text-center">Статус</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-brand-line">
                                {materials.map(mat => {
                                    const available = mat.stock - mat.reserved;
                                    const isLow = available < mat.min;
                                    
                                    return (
                                        <tr key={mat.id} className="hover:bg-brand-card transition-colors">
                                            <td className="py-4 text-brand-text font-medium">{mat.name}</td>
                                            <td className="py-4 text-brand-dim">{mat.unit}</td>
                                            <td className="py-4 text-right font-mono text-brand-text">{mat.stock}</td>
                                            <td className="py-4 text-right font-mono text-brand-faint">{mat.reserved}</td>
                                            <td className={`py-4 text-right font-mono font-bold ${isLow ? 'text-red-400' : 'text-green-400'}`}>
                                                {available.toFixed(1)}
                                            </td>
                                            <td className="py-4 text-center">
                                                {isLow ? (
                                                    <span className="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-red-900/20 text-red-400 border border-red-900/30">
                                                        Заканчивается
                                                    </span>
                                                ) : (
                                                    <span className="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-900/20 text-green-400 border border-green-900/30">
                                                        Норма
                                                    </span>
                                                )}
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                </Card>
            );
        };

        // --- RENDER ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
