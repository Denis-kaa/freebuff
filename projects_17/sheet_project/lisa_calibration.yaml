# lisa_calibration.yaml — калибровка весов LISA-3 для XLSX-домена
# ⚠️ Домен XLSX промотирован в каноничное хранилище платформы:
#    data_13/lisa_calibration.yaml (domains.xlsx). Этот файл — исторический
#    источник; для переиспользования используй `lisa_estimator --domain xlsx`.
#
# Назначение: дефолтный лексикон LISA-3 не содержит сигналов XLSX/таблиц/экспорта
# Excel, поэтому `ai_suitability` для конфигурируемого генератора Excel-дашбордов
# занижается до 0.6 → вердикт NO-GO (эвристический артефакт, не реальная оценка).
#
# Домен-приор: детерминированная кодогенерация XLSX через openpyxl — классическая
# AI-friendly задача (CRUD-подобная, хорошо изученная библиотека, нет LLM/внешних
# интеграций на первом этапе). Поднимаем множитель ai_suitability, чтобы выйти из
# NO-GO в COND. Остальные оси — нейтральные (дефолт).
#
# Семантика весов: МНОЖИТЕЛИ к сырой оценке оси (raw * weight, клип 0..10).
# Целевой вердикт: COND (условно пригоден) — честный для D2, т.к. остаётся
# ручная граница: openpyxl НЕ считает формулы → calculation validation — отдельный
# слой (LibreOffice headless). GO не оправдан, пока это ограничение не закрыто.

weights:
  engineering_complexity: 1.0
  ai_native_complexity: 1.0
  verification_burden: 1.0
  operational_risk: 1.0
  production_risk: 1.0
  ai_suitability: 7.0   # XLSX-домен prior: 0.6 * 7.0 = 4.2 → COND
