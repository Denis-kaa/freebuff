# keywords.yaml — стоп-слова (L1) и маркеры интента (L2) для Lead Detection Engine
# (промт 69 §Lead Detection Engine; policy-гейт W-7: спам-зона исключена)

# L1: быстрый отсев спама/рекламы/казино/репостов (если слово найдено → отсев)
stopwords:
  - "казино"
  - "заработок без вложений"
  - "накрутка"
  - "рассылка баз"
  - "база телефонов"
  - "продам базу"
  - "реклама"
  - "репост"
  - "подпишись"
  - "подписывайтесь"
  - "переходи по ссылке"
  - "криптовалюта"
  - "биткоин заработок"
  - "развод"
  - "лохотрон"

# L2: «клиент ищет исполнителя» = горячий лид (полярность из промта 69, не инвертирована)
client_markers:
  - "ищу"
  - "нужен"
  - "нужна"
  - "нужно"
  - "требуется"
  - "ищем"
  - "подскажите"
  - "посоветуйте"
  - "кто может"
  - "кто возьмётся"
  - "кто сделает"
  - "сделайте"
  - "сделать"
  - "заказать"
  - "заказ"
  - "разработка"
  - "разработать"
  - "необходимо реализовать"

# L2: «исполнитель ищет работу» = мусор для Attract
seeker_markers:
  - "ищу работу"
  - "ищу заказы"
  - "предлагаю услуги"
  - "оказываю услуги"
  - "выполню"
  - "сделаю"
  - "фрилансер на связи"
  - "резюме"
  - "ищу подработку"
  - "готов выполнить"
  - "возьму заказ"
